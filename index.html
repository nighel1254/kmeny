<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK – Přihlášení</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#0d0a05;--panel:#1a1208;--border:#3a2a10;--gold:#d4a84b;--gold2:#f0c96a;--text:#e8d5a3;--dim:#8a7a5a;--green:#4a9a4a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:32px; width:100%; max-width:380px; margin:16px; }
  .logo { text-align:center; margin-bottom:24px; }
  .logo h1 { font-size:22px; color:var(--gold2); }
  .logo p { font-size:12px; color:var(--dim); margin-top:4px; }
  label { font-size:12px; color:var(--dim); display:block; margin-bottom:4px; margin-top:14px; }
  input { width:100%; background:#140e04; border:1px solid var(--border); color:var(--text); padding:10px 12px; border-radius:4px; font-size:14px; outline:none; }
  input:focus { border-color:var(--gold); }
  .btn { width:100%; padding:11px; border:none; border-radius:4px; font-size:14px; font-weight:600; cursor:pointer; margin-top:20px; }
  .btn-primary { background:var(--gold); color:#1a0e00; }
  .btn-primary:hover { background:var(--gold2); }
  .error { background:#2a0a00; border:1px solid #8b2020; border-radius:4px; padding:10px; font-size:12px; color:#ff8080; margin-top:12px; display:none; }
  .success { background:#0a2a0a; border:1px solid #205020; border-radius:4px; padding:10px; font-size:12px; color:#80d080; margin-top:12px; display:none; }
  .tab-btns { display:flex; gap:6px; margin-bottom:20px; }
  .tab-btn { flex:1; padding:8px; border:1px solid var(--border); border-radius:4px; background:transparent; color:var(--dim); cursor:pointer; font-size:13px; }
  .tab-btn.active { border-color:var(--gold); color:var(--gold); background:#1e1508; }
  .hint { font-size:11px; color:var(--dim); margin-top:6px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>⚔️ DK Plánovač</h1>
    <p>cs112 – Divoké kmeny</p>
  </div>

  <div class="tab-btns">
    <button class="tab-btn active" onclick="showTab('login')">Přihlásit se</button>
    <button class="tab-btn" onclick="showTab('register')">Registrace</button>
  </div>

  <!-- LOGIN -->
  <div id="tab-login">
    <label>Nick ve hře</label>
    <input type="text" id="login-nick" placeholder="např. skret1254" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
    <label>Heslo</label>
    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" onclick="doLogin()">Přihlásit se</button>
  </div>

  <!-- REGISTER -->
  <div id="tab-register" style="display:none">
    <label>Nick ve hře</label>
    <input type="text" id="reg-nick" placeholder="např. skret1254" autocomplete="username">
    <p class="hint">Zadej přesně svůj nick z Divokých kmenů (velká/malá písmena nevadí)</p>
    <label>Heslo</label>
    <input type="password" id="reg-password" placeholder="min. 6 znaků" autocomplete="new-password">
    <label>Heslo znovu</label>
    <input type="password" id="reg-password2" placeholder="min. 6 znaků" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()">
    <button class="btn btn-primary" onclick="doRegister()">Zaregistrovat se</button>
  </div>

  <div class="error" id="err-msg"></div>
  <div class="success" id="ok-msg"></div>
</div>

<script>
const SUPABASE_URL = 'https://ucvgyduiyvfhxbyypyih.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BGBJ40g-OUsLs-PaJVvnog_dj7DaRQZ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const FAKE_DOMAIN = '@dk.cs112.tw';

// Nick → fake email
function nickToEmail(nick) {
  return nick.toLowerCase().trim() + FAKE_DOMAIN;
}

function showTab(tab) {
  document.getElementById('tab-login').style.display    = tab==='login'    ? '' : 'none';
  document.getElementById('tab-register').style.display = tab==='register' ? '' : 'none';
  document.querySelectorAll('.tab-btn').forEach((b,i) =>
    b.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1))
  );
  hideMessages();
}

function showErr(msg) {
  const el = document.getElementById('err-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('ok-msg').style.display = 'none';
}
function showOk(msg) {
  const el = document.getElementById('ok-msg');
  el.textContent = msg; el.style.display = 'block';
  document.getElementById('err-msg').style.display = 'none';
}
function hideMessages() {
  document.getElementById('err-msg').style.display = 'none';
  document.getElementById('ok-msg').style.display = 'none';
}

async function redirect(userId) {
  // Zkus načíst profil, retry kvůli možnému zpoždění triggeru
  let profile = null;
  for (let i = 0; i < 3; i++) {
    const { data } = await sb.from('profiles').select('role, player_name').eq('id', userId).single();
    if (data) { profile = data; break; }
    await new Promise(r => setTimeout(r, 400));
  }
  window.location.href = profile?.role === 'commander' ? 'commander.html' : 'dashboard.html';
}

async function doLogin() {
  const nick     = document.getElementById('login-nick').value.trim();
  const password = document.getElementById('login-password').value;
  if (!nick || !password) { showErr('Vyplň nick a heslo.'); return; }
  const { data, error } = await sb.auth.signInWithPassword({
    email: nickToEmail(nick), password
  });
  if (error) {
    showErr(error.message.includes('Invalid') ? 'Špatný nick nebo heslo.' : 'Chyba: ' + error.message);
    return;
  }
  redirect(data.user.id);
}

async function doRegister() {
  const nick  = document.getElementById('reg-nick').value.trim();
  const pass1 = document.getElementById('reg-password').value;
  const pass2 = document.getElementById('reg-password2').value;
  if (!nick)           { showErr('Vyplň svůj nick.'); return; }
  if (!pass1)          { showErr('Vyplň heslo.'); return; }
  if (pass1 !== pass2) { showErr('Hesla se neshodují.'); return; }
  if (pass1.length < 6){ showErr('Heslo musí mít alespoň 6 znaků.'); return; }

  const fakeEmail = nickToEmail(nick);
  const { data, error } = await sb.auth.signUp({
    email: fakeEmail,
    password: pass1,
    options: { data: { player_name: nick } }
  });
  if (error) {
    showErr(error.message.includes('already') ? 'Tento nick je již zaregistrován.' : 'Chyba: ' + error.message);
    return;
  }
  // Ulož player_name do profilu
  if (data.user) {
    await sb.from('profiles').upsert({ id: data.user.id, email: fakeEmail, player_name: nick });
    redirect(data.user.id);
  } else {
    showOk('Účet vytvořen! Přihlaš se.');
    showTab('login');
  }
}

// Pokud je už přihlášen, přesměruj
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) redirect(session.user.id);
});
</script>
</body>
</html>
