<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Časovač útoků – cs112</title>
<style>
  :root {
    --bg:#0f0b05; --surface:#1a1205; --border:#3a2800; --gold:#c8922a;
    --gold2:#d4a84b; --dim:#888; --text:#e8d5a0; --red:#e04040;
    --green:#4ea84e; --blue:#80c0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;font-size:13px;min-height:100vh;}

  /* ── Header ── */
  .header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1a1205;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .header h1{font-size:17px;color:var(--gold2);font-weight:700;}
  .world-badge{font-size:11px;color:var(--dim);background:#0f0b05;border:1px solid var(--border);border-radius:4px;padding:2px 7px;}
  .speed-badge{font-size:11px;color:var(--dim);}
  .header-right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

  /* ── Audio banner ── */
  #audio-banner{background:#0f0c02;border-bottom:1px solid #2a1e00;padding:5px 14px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);flex-wrap:wrap;}
  #audio-banner input[type=number]{width:42px;padding:2px 4px;font-size:11px;background:#1e1508;color:var(--text);border:1px solid var(--border);border-radius:4px;}
  #audio-unlock-btn{background:#2a1e00;color:var(--gold);border:1px solid #3a2800;border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer;white-space:nowrap;}

  /* ── Toolbar ── */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 14px;background:#120e04;border-bottom:1px solid var(--border);}
  .toolbar label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim);}
  .toolbar input,.toolbar select{background:#1e1508;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:13px;outline:none;}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--gold);}
  .coord-group{display:flex;gap:4px;align-items:center;}
  .coord-group input{width:58px;}
  .coord-sep{color:var(--dim);font-size:14px;line-height:1;}
  .arrival-group{display:flex;gap:4px;align-items:center;}
  .arrival-group input[type=datetime-local]{font-size:12px;padding:4px 5px;}
  .ms-input{width:46px;}
  .btn{padding:5px 13px;border-radius:4px;border:none;cursor:pointer;font-size:13px;font-weight:600;}
  .btn-add{background:var(--gold);color:#0f0b05;}
  .btn-add:hover{background:#dea030;}
  .btn-sm{font-size:12px;background:#1e1508;color:var(--dim);border:1px solid var(--border);padding:5px 11px;border-radius:4px;cursor:pointer;}
  .btn-sm:hover{border-color:var(--gold);color:var(--gold);}

  /* ── Paste hint ── */
  .paste-hint{font-size:10px;color:var(--dim);padding:3px 14px 5px;background:#120e04;border-bottom:1px solid var(--border);}

  /* ── Table ── */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  thead th{background:#1a1205;color:var(--dim);font-size:11px;font-weight:600;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;position:sticky;top:0;z-index:2;}
  tbody tr{border-bottom:1px solid #1e1508;transition:background .1s;}
  tbody tr:hover{background:#1e1508;}
  td{padding:7px 10px;vertical-align:middle;}
  .cd{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;min-width:80px;display:inline-block;}
  .cd.urgent{color:var(--red);}
  .cd.ok{color:#ffcf60;}
  .cd.done{color:var(--dim);}
  .cd.sent{color:var(--green);}
  .send-t{color:#ffcf60;font-size:12px;font-variant-numeric:tabular-nums;}
  .arr-t{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums;}
  .unit-lbl{font-size:11px;color:var(--dim);}
  .del-btn{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:3px;}
  .del-btn:hover{color:var(--red);}
  .sent-mark{cursor:pointer;font-size:16px;background:transparent;border:none;padding:2px 6px;}
  .row-sent td{opacity:.6;}
  .row-past td{color:#e08080;opacity:.85;}
  .coords{font-size:12px;font-variant-numeric:tabular-nums;}

  /* ── Toast ── */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:6px;font-size:13px;z-index:9999;display:none;pointer-events:none;max-width:90vw;text-align:center;}
  #toast.err{background:#8b1a1a;}
  #toast.ok{background:#1a5c1a;}

  /* ── Empty ── */
  .empty-state{padding:32px;text-align:center;color:var(--dim);}

  /* ── Alarm popup ── */
  #alarm-popup{display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a0a00;border:2px solid var(--gold);border-radius:8px;padding:12px 24px;font-size:14px;font-weight:700;color:var(--gold2);z-index:9999;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.8);}

  /* ── Mobile ── */
  @media(max-width:600px){
    .toolbar{gap:6px;}
    .coord-group input{width:50px;}
    .ms-input{width:40px;}
    thead th,td{padding:5px 6px;font-size:11px;}
    .cd{font-size:13px;}
    .header h1{font-size:15px;}
    th:nth-child(5),td:nth-child(5){display:none;} /* hide unit on mobile */
  }
</style>
</head>
<body>

<!-- Audio banner (same pattern as myplan.html) -->
<div id="audio-banner">
  <span style="flex:1;">🔔 Zvukové upozornění</span>
  <label style="display:flex;align-items:center;gap:4px;">
    <input type="number" id="sound-lead-input" min="1" max="60" value="2" onchange="saveSoundLead(this.value)"> min před odesláním
  </label>
  <button id="audio-unlock-btn" onclick="toggleSound()">Zapnout</button>
</div>

<!-- Header -->
<div class="header">
  <h1>Časovač útoků</h1>
  <div class="world-badge">cs112 – Divoké kmeny</div>
  <div class="speed-badge" id="speed-info">Načítám…</div>
  <div class="header-right">
    <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim);" title="Jak dlouho před odesláním přijde push oznámení">
      <input type="number" id="push-lead-input" min="1" max="60" value="2" style="width:38px;padding:2px 4px;font-size:11px;background:#1e1508;color:var(--text);border:1px solid var(--border);border-radius:4px;" onchange="savePushLead(this.value)"> min
    </label>
    <button id="notif-btn" onclick="toggleNotif()" class="btn-sm">🔔 Notifikace</button>
    <a href="dashboard.html" class="btn-sm" style="text-decoration:none;">← Dashboard</a>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <label>Zdroj
    <div class="coord-group">
      <input type="number" id="src-x" placeholder="500" min="1" max="999" oninput="autoAdvance(this,'src-y')" onkeydown="coordKey(event,'src-y')">
      <span class="coord-sep">|</span>
      <input type="number" id="src-y" placeholder="500" min="1" max="999" oninput="autoAdvance(this,'tgt-x')" onkeydown="coordKey(event,'tgt-x')">
    </div>
  </label>
  <label>Cíl
    <div class="coord-group">
      <input type="number" id="tgt-x" placeholder="500" min="1" max="999" oninput="autoAdvance(this,'tgt-y')" onkeydown="coordKey(event,'tgt-y')">
      <span class="coord-sep">|</span>
      <input type="number" id="tgt-y" placeholder="500" min="1" max="999" oninput="autoAdvance(this,'unit-sel')" onkeydown="coordKey(event,'unit-sel')">
    </div>
  </label>
  <label>Jednotka
    <select id="unit-sel">
      <option value="axe">Sekerník</option>
      <option value="spear">Kopinník</option>
      <option value="sword">Mečíř</option>
      <option value="lk">Lehká kavalérie</option>
      <option value="paladin">Paladin</option>
      <option value="tk">Těžká kavalérie</option>
      <option value="scout">Zvěd</option>
      <option value="ram">Beran</option>
      <option value="catapult">Katapult</option>
      <option value="noble">Šlechtic</option>
    </select>
  </label>
  <label>Čas dopadu
    <div class="arrival-group">
      <input type="datetime-local" id="arrival-input" step="1" onpaste="handleArrivalPaste(event)">
      <span style="color:var(--dim);font-size:11px;">.</span>
      <input type="number" id="arrival-ms" class="ms-input" placeholder="ms" min="0" max="999" value="0" title="Milisekundy (0–999)">
    </div>
  </label>
  <label style="justify-content:flex-end;">
    <div style="height:20px;"></div>
    <button class="btn btn-add" onclick="addRow()">+ Přidat</button>
  </label>
</div>

<!-- Paste hint -->
<div class="paste-hint">
  Tip: do pole "Čas dopadu" lze vložit i: <code>10.07.2026 22:22:49:357</code> · <code>dnes v 19:33:06:767</code> · <code>zítra v 18:33:00:132</code>
</div>

<!-- Table -->
<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>Zdroj</th>
      <th>Cíl</th>
      <th>Jednotka</th>
      <th>Odeslat v</th>
      <th>Dopad v</th>
      <th>Odpočet</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="rows-body">
    <tr><td colspan="7" class="empty-state">Zatím žádné útoky. Přidej první výše.</td></tr>
  </tbody>
</table>
</div>

<div id="alarm-popup"></div>
<div id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const WORLD    = 'cs112';
const API_BASE = `https://${WORLD}.divokekmeny.cz`;
const PROXIES  = [
  u => `https://ucvgyduiyvfhxbyypyih.supabase.co/functions/v1/game-proxy?url=${encodeURIComponent(u)}`,
  u => u,
];

const UNIT_LABELS = {
  spear:'Kopinník', sword:'Mečíř', axe:'Sekerník', scout:'Zvěd',
  lk:'Lehká kavalérie', tk:'Těžká kavalérie', ram:'Beran',
  catapult:'Katapult', noble:'Šlechtic', paladin:'Paladin'
};

let UNIT_SPEEDS_S = { spear:1080, sword:1320, axe:1080, scout:540, lk:600, tk:660, ram:1800, catapult:1800, noble:2100, paladin:600 };
let worldSpeed = 1, unitSpeedMult = 1, apiSpeedsLoaded = false;

// ── STATE ───────────────────────────────────────────────────
let rows = [];
let nextId = 1;
let soundUnlocked = false;
let notifEnabled = false;
let _audioCtx = null;
const alarmed = new Set();
const notified = new Set();
let _popupTmo = null;

// ── STORAGE ─────────────────────────────────────────────────
const LS_KEY = 'dk_timer_rows_v2';
function saveRows() { try { localStorage.setItem(LS_KEY, JSON.stringify(rows)); } catch{} }
function loadRows() {
  try { rows = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { rows = []; }
  nextId = rows.reduce((m, r) => Math.max(m, r.id + 1), 1);
}
function saveSoundLead(v) { localStorage.setItem('dk_timer_sound_lead', String(Math.max(1,Math.min(60,parseInt(v)||2)))); alarmed.clear(); }
function getSoundLeadMin() { return Math.max(1, parseInt(localStorage.getItem('dk_timer_sound_lead')) || 2); }
function savePushLead(v)  { localStorage.setItem('dk_timer_push_lead',  String(Math.max(1,Math.min(60,parseInt(v)||2)))); }
function getPushLeadMin()  { return Math.max(1, parseInt(localStorage.getItem('dk_timer_push_lead'))  || 2); }

// ── FETCH / SPEED ───────────────────────────────────────────
async function fetchWithFallback(url) {
  let lastErr;
  for (const proxify of PROXIES) {
    try {
      const r = await fetch(proxify(url), { signal: AbortSignal.timeout(5000) });
      if (r.ok) return r;
    } catch(e) { lastErr = e; }
  }
  throw lastErr || new Error('fetch failed');
}

async function loadWorldSpeed() {
  try {
    const rc = await fetchWithFallback(`${API_BASE}/interface.php?func=get_config`);
    const cfg = new DOMParser().parseFromString(await rc.text(), 'text/xml');
    worldSpeed    = parseFloat(cfg.querySelector('speed')?.textContent || '1');
    unitSpeedMult = parseFloat(cfg.querySelector('unit_speed')?.textContent || '1');

    const ru = await fetchWithFallback(`${API_BASE}/interface.php?func=get_unit_info`);
    const uid = new DOMParser().parseFromString(await ru.text(), 'text/xml');
    const unitMap = { spear:'spear', sword:'sword', axe:'axe', spy:'scout',
                      light:'lk', marcher:'paladin', heavy:'tk',
                      ram:'ram', catapult:'catapult', snob:'noble' };
    for (const [xn, k] of Object.entries(unitMap)) {
      const s = parseFloat(uid.querySelector(`${xn} > speed`)?.textContent);
      if (!isNaN(s) && s > 0) UNIT_SPEEDS_S[k] = s * 60;
    }
    apiSpeedsLoaded = true;
    document.getElementById('speed-info').textContent = `✓ Rychlost světa: ${worldSpeed}× | jednotky: ${unitSpeedMult}×`;
  } catch {
    document.getElementById('speed-info').textContent = '⚠ Výchozí rychlost (nelze načíst ze serveru)';
  }
}

// ── TRAVEL TIME (stejný vzorec jako commander.html) ─────────
function travelMs(x1, y1, x2, y2, unit) {
  const ws   = worldSpeed || 1;
  const um   = unitSpeedMult || 1;
  const dist = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
  const speedS = UNIT_SPEEDS_S[unit] || 1800;
  if (apiSpeedsLoaded) return dist * speedS * 1000;
  return dist * speedS / (ws * um) * 1000;
}

// ── COORD AUTO-ADVANCE ───────────────────────────────────────
function autoAdvance(el, nextId) {
  if (String(el.value).length >= 3) document.getElementById(nextId)?.focus();
}
function coordKey(e, nextId) {
  if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    document.getElementById(nextId)?.focus();
  }
}

// ── ARRIVAL TIME PARSING ─────────────────────────────────────
// Formats: "10.07.2026 22:22:49:357" / "dnes v 19:33:06:767" / "zítra v 18:33:00:132"
//          also standard datetime-local paste
function handleArrivalPaste(e) {
  e.preventDefault();
  const raw = (e.clipboardData || window.clipboardData).getData('text').trim();
  const parsed = parseArrivalStr(raw);
  if (!parsed) { toast('Nepodařilo se rozpoznat formát času!', 'err'); return; }
  fillArrival(parsed.ts, parsed.ms);
}

function parseArrivalStr(raw) {
  const s = raw.trim();

  // "dnes v HH:MM:SS:mmm" or "dnes v HH:MM:SS"
  let m = s.match(/^dnes\s+v\s+(\d{1,2}):(\d{2}):(\d{2})(?::(\d{1,3}))?$/i);
  if (m) {
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
                       parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));
    return { ts: d.getTime(), ms: parseInt(m[4]||'0') };
  }

  // "zítra v HH:MM:SS:mmm"
  m = s.match(/^z[íi]tra\s+v\s+(\d{1,2}):(\d{2}):(\d{2})(?::(\d{1,3}))?$/i);
  if (m) {
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1,
                       parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));
    return { ts: d.getTime(), ms: parseInt(m[4]||'0') };
  }

  // "DD.MM.YYYY HH:MM:SS:mmm" or "DD.MM.YYYY HH:MM:SS"
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})(?::(\d{1,3}))?$/);
  if (m) {
    const d = new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]),
                       parseInt(m[4]), parseInt(m[5]), parseInt(m[6]));
    return { ts: d.getTime(), ms: parseInt(m[7]||'0') };
  }

  return null;
}

function fillArrival(ts, ms) {
  const d = new Date(ts - new Date().getTimezoneOffset()*60000);
  document.getElementById('arrival-input').value = d.toISOString().slice(0,19);
  document.getElementById('arrival-ms').value = ms || 0;
}

function getArrivalTime() {
  const str = document.getElementById('arrival-input').value;
  if (!str) return null;
  const base = new Date(str).getTime();
  if (isNaN(base)) return null;
  const ms = Math.max(0, Math.min(999, parseInt(document.getElementById('arrival-ms').value) || 0));
  return base + ms;
}

// ── ADD ROW ─────────────────────────────────────────────────
function addRow() {
  const srcX = parseInt(document.getElementById('src-x').value);
  const srcY = parseInt(document.getElementById('src-y').value);
  const tgtX = parseInt(document.getElementById('tgt-x').value);
  const tgtY = parseInt(document.getElementById('tgt-y').value);
  const unit = document.getElementById('unit-sel').value;

  if ([srcX,srcY,tgtX,tgtY].some(isNaN)) { toast('Zadej souřadnice!', 'err'); return; }

  const arrivalTime = getArrivalTime();
  if (!arrivalTime) { toast('Zadej čas dopadu!', 'err'); return; }

  const travel = travelMs(srcX, srcY, tgtX, tgtY, unit);
  const sendTime = arrivalTime - travel;

  if (sendTime < Date.now() + 30000) { toast('Čas odeslání je příliš blízko nebo v minulosti!', 'err'); return; }

  const row = { id: nextId++, srcX, srcY, tgtX, tgtY, unit, arrivalTime, sendTime, sent: false };
  rows.push(row);
  saveRows();
  renderTable();
  toast(`Přidáno – odeslat v ${fmtTime(sendTime, true)}`, 'ok');
}

function removeRow(id) {
  rows = rows.filter(r => r.id !== id);
  alarmed.delete(id); notified.delete(id);
  saveRows(); renderTable();
}

function markSent(id) {
  const r = rows.find(r => r.id === id);
  if (r) { r.sent = !r.sent; saveRows(); renderTable(); }
}

// ── FORMAT ──────────────────────────────────────────────────
function pad(n,w=2){ return String(Math.floor(n)).padStart(w,'0'); }

function fmtTime(ms, withMs=false) {
  const d = new Date(ms);
  const base = `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  if (!withMs) return base;
  return base + ':' + pad(ms % 1000, 3);
}

function fmtCountdown(diffMs) {
  if (diffMs <= 0) return null;
  const totalMs = Math.floor(diffMs);
  const ms  = totalMs % 1000;
  const s   = Math.floor(totalMs / 1000) % 60;
  const m   = Math.floor(totalMs / 60000) % 60;
  const h   = Math.floor(totalMs / 3600000);
  if (h > 0) return `${h}:${pad(m)}:${pad(s)}`;
  return `${pad(m)}:${pad(s)}.${pad(ms,3)}`;
}

// ── RENDER TABLE ─────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('rows-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Zatím žádné útoky. Přidej první výše.</td></tr>';
    return;
  }
  const now = Date.now();
  const sorted = [...rows].sort((a,b) => a.sendTime - b.sendTime);
  tbody.innerHTML = sorted.map(r => {
    const isSent = r.sent;
    const isPast = r.sendTime < now && !isSent;
    const cls = isSent ? 'row-sent' : isPast ? 'row-past' : '';
    const diff = r.sendTime - now;
    let cdHtml;
    if (isSent) cdHtml = `<span class="cd sent">✓ Odesláno</span>`;
    else if (diff <= 0) cdHtml = `<span class="cd done">Zmeškal</span>`;
    else cdHtml = `<span class="cd ${diff<120000?'urgent':'ok'}" id="cd-${r.id}">${fmtCountdown(diff)}</span>`;

    // show ms in send and arrival time
    const sendMs = r.sendTime % 1000;
    const arrMs  = r.arrivalTime % 1000;

    return `<tr class="${cls}">
      <td class="coords">${r.srcX}|${r.srcY}</td>
      <td class="coords">${r.tgtX}|${r.tgtY}</td>
      <td class="unit-lbl">${UNIT_LABELS[r.unit]||r.unit}</td>
      <td class="send-t">${fmtTime(r.sendTime)}:<span style="color:#aaa;font-size:10px;">${pad(sendMs,3)}</span></td>
      <td class="arr-t">${fmtTime(r.arrivalTime)}:<span style="font-size:10px;">${pad(arrMs,3)}</span></td>
      <td>${cdHtml}</td>
      <td style="white-space:nowrap;">
        <button class="sent-mark" onclick="markSent(${r.id})" title="${isSent?'Odznačit':'Označit jako odesláno'}">${isSent?'↩️':'✅'}</button>
        <button class="del-btn" onclick="removeRow(${r.id})" title="Smazat">✕</button>
      </td>
    </tr>`;
  }).join('');
}

// ── LIVE COUNTDOWNS ──────────────────────────────────────────
function updateCountdowns() {
  const now = Date.now();
  const soundLeadMs = getSoundLeadMin() * 60000;
  const pushLeadMs  = getPushLeadMin()  * 60000;

  rows.forEach(r => {
    if (r.sent) return;
    const diff = r.sendTime - now;

    const el = document.getElementById(`cd-${r.id}`);
    if (el) {
      if (diff <= 0) {
        el.textContent = 'Zmeškal'; el.className = 'cd done';
        el.closest('tr')?.classList.add('row-past');
      } else {
        el.className = `cd ${diff<120000?'urgent':'ok'}`;
        el.textContent = fmtCountdown(diff);
      }
    }

    if (!alarmed.has(r.id) && diff > 0 && diff <= soundLeadMs) {
      alarmed.add(r.id);
      triggerAlarm(r, diff);
    }
    if (!notified.has(r.id) && notifEnabled && diff > 0 && diff <= pushLeadMs) {
      notified.add(r.id);
      sendPush(r, diff);
    }
  });
}

// ── AUDIO ────────────────────────────────────────────────────
function getACtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

function playSiren(volume=0.4) {
  if (!soundUnlocked) return;
  try {
    const ctx = getACtx();
    [[880,.15],[660,.15],[880,.15],[660,.2]].forEach(([freq,dur],i) => {
      const osc = ctx.createOscillator();
      const g   = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = 'square';
      const t = ctx.currentTime + i*0.18;
      g.gain.setValueAtTime(volume, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+dur);
      osc.start(t); osc.stop(t+dur+0.05);
    });
  } catch {}
}

function toggleSound() {
  const btn = document.getElementById('audio-unlock-btn');
  const banner = document.getElementById('audio-banner');
  if (soundUnlocked) {
    soundUnlocked = false;
    banner.style.background='#0f0c02'; banner.style.borderColor='#2a1e00';
    btn.textContent='Zapnout'; btn.style.background='#2a1e00'; btn.style.color='var(--gold)';
  } else {
    try { getACtx(); } catch {}
    soundUnlocked = true;
    banner.style.background='#0a1a0a'; banner.style.borderColor='#1a4a1a';
    btn.textContent='✓ Zapnuto'; btn.style.background='#205020'; btn.style.color='#80d080';
    setTimeout(() => playSiren(0.15), 100);
  }
}

function triggerAlarm(r, diffMs) {
  playSiren();
  setTimeout(() => playSiren(), 1500);
  setTimeout(() => playSiren(), 3000);

  const popup = document.getElementById('alarm-popup');
  const sec = Math.round(diffMs / 1000);
  popup.innerHTML = `⏰ Odeslat za ${sec}s!<br><span style="font-size:12px;font-weight:normal;">${r.srcX}|${r.srcY} → ${r.tgtX}|${r.tgtY} · ${UNIT_LABELS[r.unit]||r.unit}</span>`;
  popup.style.display = 'block';
  clearTimeout(_popupTmo);
  _popupTmo = setTimeout(() => { popup.style.display='none'; }, 8000);
}

// ── NOTIFICATIONS ─────────────────────────────────────────────
async function toggleNotif() {
  const btn = document.getElementById('notif-btn');
  if (notifEnabled) {
    notifEnabled = false;
    btn.textContent='🔔 Notifikace'; btn.style.color=''; btn.style.borderColor='';
    return;
  }
  if (!('Notification' in window)) { toast('Prohlížeč nepodporuje notifikace.', 'err'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Notifikace nebyly povoleny.', 'err'); return; }
  notifEnabled = true;
  btn.textContent='🔔 Notifikace ✓'; btn.style.color='#60d060'; btn.style.borderColor='#1a4a1a';
  toast('Notifikace zapnuty', 'ok');
}

function sendPush(r, diffMs) {
  if (Notification.permission !== 'granted') return;
  const sec = Math.round(diffMs / 1000);
  new Notification(`⚔ Odeslat za ${sec}s`, {
    body: `${r.srcX}|${r.srcY} → ${r.tgtX}|${r.tgtY} · ${UNIT_LABELS[r.unit]||r.unit}\nDopad: ${fmtTime(r.arrivalTime, true)}`,
    icon: 'icon-192.png',
    tag: `timer-${r.id}`,
    requireInteraction: true,
  });
}

// ── TOAST ────────────────────────────────────────────────────
let _toastTmo;
function toast(msg, type='', ms=3500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = type; el.style.display = 'block';
  clearTimeout(_toastTmo);
  _toastTmo = setTimeout(() => { el.style.display='none'; }, ms);
}

// ── INIT ─────────────────────────────────────────────────────
loadRows();
renderTable();
loadWorldSpeed();

// Restore lead inputs
document.getElementById('sound-lead-input').value = getSoundLeadMin();
document.getElementById('push-lead-input').value  = getPushLeadMin();

// Default arrival = now + 1h
const _d = new Date(Date.now() + 3600000);
_d.setMilliseconds(0);
document.getElementById('arrival-input').value = new Date(_d - _d.getTimezoneOffset()*60000).toISOString().slice(0,19);
document.getElementById('arrival-ms').value = 0;

// Enter in toolbar → add row
document.querySelectorAll('.toolbar input, .toolbar select').forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') addRow(); });
});

setInterval(updateCountdowns, 100);
</script>
