<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK – Plán útoků</title>
<link rel="icon" href="/kmeny/icon-192.png">
<link rel="apple-touch-icon" href="/kmeny/icon-192.png">
<link rel="manifest" href="/kmeny/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DK Plán">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
  :root {
    --bg:#0d0a05;--panel:#1a1208;--border:#3a2a10;--gold:#d4a84b;--gold2:#f0c96a;
    --text:#e8d5a3;--dim:#8a7a5a;--green:#4a9a4a;--urgent:#cc3333;--night:#1a0a2a;
    --gold-night:#8a6aaa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;font-size:13px;}
  input,select,textarea{background:#140e04;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:13px;outline:none;}
  input[type="datetime-local"]{color-scheme:dark;}
  input[type="datetime-local"]::-webkit-calendar-picker-indicator{filter:invert(0.8);cursor:pointer;opacity:0.8;}

  /* Audio banner – tenký proužek */
  #audio-banner { background:#0f0c02; border-bottom:1px solid #2a1e00; padding:5px 16px; display:flex; align-items:center; gap:10px; font-size:11px; color:var(--dim); }
  #audio-banner.active { background:#061006; border-color:#1a3a1a; }
  #audio-unlock-btn { background:#1e1200; color:var(--gold); border:1px solid #3a2800; border-radius:4px; padding:3px 10px; font-size:11px; cursor:pointer; white-space:nowrap; }
  #audio-unlock-btn.active { background:#0a1a0a; color:#60d060; border-color:#1a4a1a; }

  /* Toggle přepínač místo checkboxu */
  .toggle-wrap { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .toggle-wrap input { display:none; }
  .toggle-track { width:32px; height:18px; background:#2a2010; border-radius:9px; position:relative; transition:.2s; border:1px solid var(--border); flex-shrink:0; }
  .toggle-track::after { content:''; position:absolute; left:2px; top:2px; width:12px; height:12px; background:var(--dim); border-radius:50%; transition:.2s; }
  input:checked + .toggle-track { background:#205020; border-color:#305030; }
  input:checked + .toggle-track::after { left:16px; background:#80d080; }

  /* Header */
  .top-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .top-bar h1{font-size:16px;color:var(--gold2);font-weight:700;}
  .top-bar .meta{font-size:11px;color:var(--dim);}
  .nav-btn { font-size:12px; text-decoration:none; background:#1e1508; border:1px solid var(--border); color:var(--dim); padding:5px 12px; border-radius:4px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .nav-btn:hover { border-color:var(--gold); color:var(--gold); }
  .nav-btn.primary { border-color:var(--gold); color:var(--gold); }

  /* Summary */
  .summary-bar{background:#131008;border-bottom:1px solid var(--border);padding:7px 16px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;align-items:center;}

  /* Filter bar */
  .filter-bar { padding:8px 14px; background:#0f0c05; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .filter-bar input { background:#1a1208; border:1px solid var(--border); color:var(--text); padding:5px 12px; border-radius:20px; font-size:12px; flex:1; min-width:150px; outline:none; }
  .filter-bar input:focus { border-color:var(--gold); }
  .filter-label { font-size:12px; color:var(--dim); white-space:nowrap; }

  /* Table */
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;margin:12px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{background:#1a1208;color:var(--gold);font-weight:600;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
  th:hover{color:var(--gold2);}
  td{padding:6px 10px;border-bottom:1px solid #1e1608;vertical-align:middle;}
  tr:hover td{background:#1e1a0e}
  .past-row td{opacity:.3;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.15);}
  .past-row{background:#070503!important;border-left:3px solid #333!important;}
  .played-row td{opacity:.4;text-decoration:line-through;text-decoration-color:rgba(80,200,80,.3);}
  .played-row{background:#040a04!important;border-left:3px solid #4a9a4a!important;}
  .night-row td{background:var(--night)!important}
  .coords{font-family:monospace;color:var(--gold2);font-weight:bold}
  .chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap;gap:3px;}
  .chip-noble{background:#2a0020;color:#ff80c0;border:1px solid #802060}
  .chip-night{background:#1a0a2a;color:#9a6aaa;border:1px solid #4a2a6a;margin-left:4px}
  .send-time{font-family:monospace;white-space:nowrap;}
  .send-time.night{color:var(--gold-night)}
  .arrival-time{font-family:monospace;white-space:nowrap;color:var(--dim)}
  .countdown{font-family:monospace;font-weight:bold;font-size:13px;cursor:pointer;}
  .countdown.ok{color:var(--green)}
  .countdown.soon{color:#c08020}
  .countdown.urgent{color:var(--urgent)}
  .countdown.past{color:var(--dim)}
  .play-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:#1a1208;border:1px solid var(--border);border-radius:4px;cursor:pointer;color:var(--green);text-decoration:none;}
  .play-btn svg{width:14px;height:14px;fill:currentColor}
  .play-btn:hover{background:#2a2010;border-color:var(--gold)}
  .error{background:#2a0a0a;border:1px solid #8b2020;border-radius:8px;padding:20px;text-align:center;color:#ff8080;margin:40px auto;max-width:500px}
  .warning-box{background:#1a0800;border-left:3px solid #6b2000;padding:6px 12px;margin:6px 12px;font-size:11px;color:#cc7733;border-radius:0 4px 4px 0;}
  /* ── MOBILE ──────────────────────────────────────────────── */
  @media (max-width: 480px) {
    .top-bar { padding: 8px 12px; gap: 6px; }
    .top-bar h1 { font-size: 14px; }
    .summary-bar { overflow-x: auto; flex-wrap: nowrap; gap: 10px; font-size: 11px; padding: 6px 10px; white-space: nowrap; }
    .panel { margin: 6px; }
    #tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { font-size: 11px; }
    th, td { padding: 5px 6px; }
  }
</style>
</head>
<body style="visibility:hidden">

<!-- Audio unlock banner -->
<div id="audio-banner" style="background:#0f0c02;border-bottom:1px solid #2a1e00;padding:5px 16px;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);">
  <span style="flex:1;">🔔 Zvukové upozornění 2 min před odesláním</span>
  <button id="audio-unlock-btn" onclick="unlockAudio()" class="">Zapnout</button>
</div>

<div id="app">
  <div style="text-align:center;padding:40px;color:var(--dim);">Načítám plán...</div>
</div>

<script>
const API_BASE = 'https://cs112.divokekmeny.cz';
const API_IMG  = `${API_BASE}/graphic/unit`;
const NIGHT_START = 0, NIGHT_END = 6;

const UNIT_EMOJI = { ram:'🪨', noble:'👑', lk:'🐎', scout:'🔍', axe:'🪓', tk:'🛡️', spear:'⚔️', sword:'🗡️', catapult:'💣', paladin:'✨' };
function unitImg(key) {
  const file = key==='lk'?'light':key==='tk'?'heavy':key==='scout'?'spy':key==='paladin'?'knight':key==='noble'?'snob':key;
  return `<img src="${API_IMG}/unit_${file}.png" style="width:20px;height:20px;vertical-align:middle;margin-right:3px;" onerror="this.outerHTML='<span style=margin-right:4px>${UNIT_EMOJI[key]||'⚔️'}</span>'">`;
}
const UNIT_LABELS = {
  ram:     `${unitImg('ram')} Beranidlo`,
  noble:   `${unitImg('noble')} Šlechtic`,
  lk:      `${unitImg('lk')} LK`,
  scout:   `${unitImg('scout')} Špeh`,
  axe:     `${unitImg('axe')} Sekerník`,
  tk:      `${unitImg('tk')} TK`,
  spear:   `${unitImg('spear')} Kopiník`,
  sword:   `${unitImg('sword')} Šermíř`,
  catapult:`${unitImg('catapult')} Katapult`,
  paladin: `${unitImg('paladin')} Paladin`,
};

const SMALL_ICO  = 'https://help.divokekmeny.cz/images/b/b6/Small.png';
const LARGE_ICO  = 'https://help.divokekmeny.cz/images/7/71/Large.png';
const MEDIUM_ICO = 'https://help.divokekmeny.cz/images/9/96/Medium.png';
const twImg = (url, style='') => `<img src="${url}" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;${style}" onerror="this.style.display='none'">`;
const NOBLE_FLIP = `<img src="${API_IMG}/unit_snob.png" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;transform:rotate(180deg);" onerror="this.style.display='none'">`;
const NOBLE_NORM = `<img src="${API_IMG}/unit_snob.png" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;" onerror="this.style.display='none'">`;
const AXE_RED = `<img src="${API_IMG}/unit_axe.png" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;filter:sepia(1)saturate(4)hue-rotate(330deg)" onerror="this.style.display='none'">`;
const AXE_YEL = `<img src="${API_IMG}/unit_axe.png" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;filter:sepia(1)saturate(4)hue-rotate(20deg)" onerror="this.style.display='none'">`;
const AXE_BRN = `<img src="${API_IMG}/unit_axe.png" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;filter:sepia(1)saturate(3)brightness(0.85)" onerror="this.style.display='none'">`;
const AXE_GRN = `<img src="${API_IMG}/unit_axe.png" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;filter:sepia(1)saturate(4)hue-rotate(90deg)brightness(1.3)" onerror="this.style.display='none'">`;

function typeChip(r) {
  if (r.isFakeNoble) return `<span class="chip" style="background:#1a0a1a;color:#ffffff;border:1px solid #4a1a5a">${NOBLE_FLIP} fejk vlak</span>`;
  if (r.isFake)                  return `<span class="chip" style="background:#1a0a00;color:#40cc40;border:1px solid #206020">${AXE_GRN} fejk</span>`;
  if (r.srcCategory==='fullka')  return `<span class="chip" style="background:#2a0000;color:#ff4040;border:1px solid #802020">${AXE_RED} fullka</span>`;
  if (r.srcCategory==='triq_off')return `<span class="chip" style="background:#1a1a00;color:#f0c040;border:1px solid #606010">${AXE_YEL} 3/4 off</span>`;
  if (r.srcCategory==='half_off')return `<span class="chip" style="background:#1a0e00;color:#c07840;border:1px solid #604020">${AXE_BRN} 1/2 off</span>`;
  if (r.srcCategory==='noble')   return `<span class="chip chip-noble">${NOBLE_NORM} vlak</span>`;
  return `<span class="chip" style="background:#1a0800;color:#c06020;border:1px solid #604010">${AXE_BRN} mini off</span>`;
}

let attackRows = [], cdInterval = null;
let currentSort = 'send', sortAsc = true;

const pad = n => String(Math.floor(n)).padStart(2,'0');
function fmtDT(dt)  { return `${dt.getDate()}.${dt.getMonth()+1}. ${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`; }
function fmtDur(ms) { const s=ms/1000,h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=Math.floor(s%60); return h?`${h}h ${m}m ${sc}s`:m?`${m}m ${sc}s`:`${sc}s`; }
function fmtHMS(ms) { const s=Math.floor(ms/1000); return `${pad(s/3600)}:${pad((s%3600)/60)}:${pad(s%60)}`; }
function isNight(ts){ const h=new Date(ts).getHours(); return h>=NIGHT_START&&h<NIGHT_END; }

function sortIndicator(col) {
  if (currentSort!==col) return '<span style="opacity:.3">↕</span>';
  return sortAsc?'↑':'↓';
}

function setSort(col) {
  if (currentSort===col) sortAsc=!sortAsc; else { currentSort=col; sortAsc=true; }
  renderTable();
}

// ── ZVUK SIRÉNY ────────────────────────────────────────────
let audioUnlocked = localStorage.getItem('dk_audio_unlocked') === '1';
let _audioResumeInterval = null;

function getAudioCtx() {
  // Vždy vytvoř nový context – Safari pozastaví starý na pozadí
  return new (window.AudioContext || window.webkitAudioContext)();
}

function unlockAudio() {
  if (audioUnlocked) {
    // Toggle OFF
    audioUnlocked = false;
    localStorage.removeItem('dk_audio_unlocked');
    if (_audioResumeInterval) { clearInterval(_audioResumeInterval); _audioResumeInterval = null; }
    const btn = document.getElementById('audio-unlock-btn');
    const banner = document.getElementById('audio-banner');
    if (banner) { banner.style.background='#0f0c02'; banner.style.borderColor='#3a2a00'; }
    if (btn) { btn.textContent='Zapnout'; btn.style.background='#2a1e00'; btn.style.color='var(--gold)'; }
    return;
  }
  try {
    // Odemkni audio kliknutím
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    ctx.close();

    audioUnlocked = true;
    localStorage.setItem('dk_audio_unlocked', '1');

    const banner = document.getElementById('audio-banner');
    const btn = document.getElementById('audio-unlock-btn');
    if (banner) { banner.style.background='#0a1a0a'; banner.style.borderColor='#1a4a1a'; }
    if (btn) { btn.textContent='✓ Zapnuto'; btn.style.background='#205020'; btn.style.color='#80d080'; }

    // Test zvuk
    setTimeout(() => playSiren(0.15), 200);

    // Na Safari mobile – pravidelně "keepalive" audio aby se nesuspendoval
    _audioResumeInterval = setInterval(() => {
      if (!audioUnlocked) return;
      try {
        const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
        const buf2 = ctx2.createBuffer(1, 1, 22050);
        const src2 = ctx2.createBufferSource();
        src2.buffer = buf2;
        src2.connect(ctx2.destination);
        src2.start(0);
        setTimeout(() => ctx2.close(), 100);
      } catch(e) {}
    }, 25000); // každých 25s tichý ping

  } catch(e) { console.warn('Audio unlock failed:', e); }
}

// Obnov stav tlačítka po načtení stránky
document.addEventListener('DOMContentLoaded', () => {
  if (audioUnlocked) {
    const banner = document.getElementById('audio-banner');
    const btn = document.getElementById('audio-unlock-btn');
    if (banner) { banner.style.background='#0a1a0a'; banner.style.borderColor='#1a4a1a'; }
    if (btn) { btn.textContent='✓ Zapnuto'; btn.style.background='#205020'; btn.style.color='#80d080'; }
  }
});

// Na Safari – keepalive audio při návratu na stránku
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && audioUnlocked) {
    // Tiché přehrání pro odemčení AudioContext po pozastavení
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const buf = ctx.createBuffer(1,1,22050);
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(ctx.destination); src.start(0);
      setTimeout(() => ctx.close(), 200);
    } catch(e) {}
    checkSirenAlerts();
  }
});

function playSiren(volume = 0.4) {
  if (!audioUnlocked) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    // Veselá fanfára – vzestupná melodie
    const notes = [
      { freq: 523, t: 0,    dur: 0.12 },  // C5
      { freq: 659, t: 0.13, dur: 0.12 },  // E5
      { freq: 784, t: 0.26, dur: 0.12 },  // G5
      { freq: 1047,t: 0.39, dur: 0.25 },  // C6
      { freq: 784, t: 0.65, dur: 0.12 },  // G5
      { freq: 1047,t: 0.78, dur: 0.4  },  // C6 (dlouhé)
    ];
    notes.forEach(({ freq, t, dur }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + t);
      gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + t + 0.01);
      gain.gain.setValueAtTime(volume, ctx.currentTime + t + dur - 0.05);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + t + dur);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + dur + 0.05);
    });
    setTimeout(() => ctx.close(), 1500);
  } catch(e) { console.warn('Audio error:', e); }
}

// Sleduj odpočty a přehraj sirénu 2 minuty před odesláním
const siren2minAlerted = new Set();
function checkSirenAlerts() {
  if (!audioUnlocked) return;
  const now = Date.now();
  attackRows.forEach(r => {
    const key = rowKey(r);
    if (playedRows.has(key) || siren2minAlerted.has(key)) return;
    const diff = r.sendTime - now;
    if (diff > 0 && diff <= 120000) {
      siren2minAlerted.add(key);
      playSiren();
      const tEl = document.createElement('div');
      tEl.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a0a00;border:2px solid var(--gold);border-radius:8px;padding:12px 24px;font-size:14px;font-weight:700;color:var(--gold2);z-index:9999;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.8);';
      tEl.innerHTML = `⏰ 2 minuty do odeslání!<br><span style="font-size:12px;font-weight:normal;">${r.srcX}|${r.srcY} → ${r.tgtX}|${r.tgtY}</span>`;
      document.body.appendChild(tEl);
      setTimeout(() => tEl.remove(), 8000);
    }
  });
}

// Na Safari – zkontroluj alerty když se stránka vrátí do popředí
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && audioUnlocked) {
    checkSirenAlerts();
  }
});

// ── WEB PUSH NOTIFIKACE ────────────────────────────────────
const VAPID_PUBLIC = 'BHrpp7MbdTooRg22UB1ePAGUfmJR2oHhH_BTqhzDKxGnrsJLpprM9vJdz914Nqcy5NCBJsjtAUvJoN5NUo4OzOY';
let swRegistration = null;

async function initServiceWorker() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    swRegistration = await navigator.serviceWorker.register('/kmeny/sw.js');
    await navigator.serviceWorker.ready;
    return swRegistration;
  } catch(e) { console.warn('SW failed:', e); return null; }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return new Uint8Array([...rawData].map(c => c.charCodeAt(0)));
}

function toast(msg, type='info', ms=3000) {
  const t = document.createElement('div');
  const colors = {ok:'#205020', err:'#502020', info:'#1a1a40'};
  t.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${colors[type]||colors.info};color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;z-index:9999;box-shadow:0 2px 12px rgba(0,0,0,.5);`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

async function resetNotifications() {
  localStorage.removeItem('dk_notif_enabled');
  localStorage.removeItem('dk_device_id');
  try {
    const { data: { session } } = await sbP.auth.getSession();
    if (session) await sbP.from('push_subscriptions').delete().eq('user_id', session.user.id);
  } catch(e) {}
  updateNotifButton(false);
  toast('Notifikace resetovány – klikni znovu pro zapnutí.', 'info', 4000);
}

async function enableNotifications() {
  // Toggle OFF
  if (localStorage.getItem('dk_notif_enabled') === '1') {
    localStorage.removeItem('dk_notif_enabled');
    updateNotifButton(false);
    try {
      const { data: { session } } = await sbP.auth.getSession();
      const deviceId = localStorage.getItem('dk_device_id') || 'default';
      if (session) await sbP.from('push_subscriptions').delete().eq('user_id', session.user.id).eq('device_id', deviceId);
    } catch(e) {}
    toast('Notifikace vypnuty.', 'info');
    return;
  }

  if (!('Notification' in window)) { toast('Prohlížeč nepodporuje notifikace.', 'err'); return; }

  const reg = await initServiceWorker();
  if (!reg) { toast('Service Worker se nepodařilo spustit.', 'err'); return; }

  const permission = await Notification.requestPermission();
  if (permission !== 'granted') { toast('Notifikace nebyly povoleny.', 'err'); return; }

  try {
    // Vytvoř push subscription
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
      });
    }

    // Ulož subscription + naplánované časy do Supabase
    const { data: { session } } = await sbP.auth.getSession();
    if (!session) { toast('Nejsi přihlášen.', 'err'); return; }

    const alarms = attackRows
      .filter(r => !playedRows.has(rowKey(r)))
      .map(r => ({
        send_time: Math.round(r.sendTime),
        src: `${r.srcX}|${r.srcY}`,
        tgt: `${r.tgtX}|${r.tgtY}`,
        row_key: rowKey(r)
      }))
      .filter(a => a.send_time - Date.now() > 60000); // jen budoucí

// ── PŘEPLÁNOVÁNÍ JEDNOHO PŘÍKAZU ZA BĚHU ────────────────────
const REPLAN_CAT_PRIORITY = { fullka:3, triq_off:2, half_off:1, mini_off:0 };

function getVillagePool() {
  const seen = new Map();
  attackRows.forEach(r => {
    const key = `${r.srcX}|${r.srcY}`;
    if (!seen.has(key)) seen.set(key, { x:r.srcX, y:r.srcY, name:r.srcName, id:r.srcId, category:r.srcCategory, player:r.srcPlayer });
  });
  return [...seen.values()];
}

function replanRowPlan(rowIdx) {
  const row = attackRows[rowIdx];
  if (!row) return;
  const distOrig = Math.sqrt((row.srcX-row.tgtX)**2 + (row.srcY-row.tgtY)**2);
  if (!distOrig) { toast('Nelze přeplánovat (nulová vzdálenost).', 'err'); return; }
  const msPerDist = row.travel / distOrig;

  const now = Date.now();
  const usageCount = {};
  attackRows.forEach((r,i) => {
    if (i === rowIdx) return;
    const k = `${r.srcX}|${r.srcY}`;
    usageCount[k] = (usageCount[k]||0) + 1;
  });

  const origCatVal = REPLAN_CAT_PRIORITY[row.srcCategory] ?? -1;
  const candidates = [];
  for (const v of getVillagePool()) {
    if (v.x === row.srcX && v.y === row.srcY) continue;
    if (row.srcCategory !== 'noble') {
      const vCatVal = REPLAN_CAT_PRIORITY[v.category] ?? -1;
      if (origCatVal >= 0 && vCatVal < origCatVal) continue;
    }
    const dist = Math.sqrt((v.x-row.tgtX)**2 + (v.y-row.tgtY)**2);
    const travel = dist * msPerDist;
    const sendTime = row.arrivalTime - travel;
    if (sendTime < now + 60000) continue;
    candidates.push({
      srcId:v.id, srcName:v.name, srcPlayer:v.player, srcX:v.x, srcY:v.y,
      srcCategory: row.srcCategory==='noble' ? 'noble' : v.category,
      tgtX:row.tgtX, tgtY:row.tgtY, tgtName:row.tgtName, tgtId:row.tgtId, tgtOwner:row.tgtOwner,
      unit: row.unit, sendTime, arrivalTime: row.arrivalTime, travel,
      night: isNight(sendTime), isFake: row.isFake, isFakeNoble: row.isFakeNoble, isNoble: row.isNoble, isPast: false,
      usage: usageCount[`${v.x}|${v.y}`] || 0
    });
  }

  if (!candidates.length) { toast('⚠ Nenalezena vhodná náhradní vesnice.', 'err', 6000); return; }

  candidates.sort((a,b) => {
    if (a.night !== b.night) return a.night ? 1 : -1;
    if (a.usage !== b.usage) return a.usage - b.usage;
    const da = Math.abs(a.srcX-row.srcX) + Math.abs(a.srcY-row.srcY);
    const db = Math.abs(b.srcX-row.srcX) + Math.abs(b.srcY-row.srcY);
    return da - db;
  });

  const best = candidates[0];
  attackRows[rowIdx]._replanProposal = best;
  showReplanProposal(rowIdx, best);
}

function decodeData(json) {
  const d = JSON.parse(json);
  // Nový kompaktní formát (pole řádků)
  if (d.r) {
    return {
      player: d.p, world: d.w, exported: d.e * 1000, label: d.l || '',
      rows: d.r.map(a => ({
        srcId: a[0]||null, srcName: a[1], srcX: a[2], srcY: a[3], srcCategory: a[4], srcPlayer: a[5]||'',
        tgtX: a[6], tgtY: a[7], tgtName: a[8]||`${a[6]}|${a[7]}`, tgtId: a[9]||null, tgtOwner: a[10],
        unit: a[11], sendTime: a[12]*1000, arrivalTime: a[13]*1000, travel: a[14]*1000,
        isFake:      !!(a[15]&1),
        isFakeNoble: !!(a[15]&2),
        isNoble:     !!(a[15]&4),
        night:       !!(a[15]&8),
        nobleCount: a[16]||null
      }))
    };
  }
  // Formát z dashboard (objekty, krátké klíče p/w/e + rows pole objektů)
  if (d.p || d.w) {
    return { player: d.p, world: d.w, exported: (d.e||0) * 1000, rows: d.rows || [] };
  }
  // Starý formát (dlouhé klíče)
  return { player: d.player, world: d.world, exported: d.exported, rows: d.rows };
}

function init() {
  syncPlayedRows().then(() => {
    // Polling každých 30s
    setInterval(async () => {
      const prev = playedRows.size;
      await syncPlayedRows();
      if (playedRows.size > prev) renderTable();
    }, 30000);
  const hash = location.hash.slice(1);
  if (!hash) {
    document.getElementById('app').innerHTML = '<div class="error">⚠️ Neplatný odkaz – chybí data plánu.</div>';
    return;
  }
  try {
    let json = null;

    // 1. Zkus nový base64url formát (LZString.compressToBase64 + url-safe)
    try {
      const b64 = hash.replace(/-/g,'+').replace(/_/g,'/');
      const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
      json = LZString.decompressFromBase64(padded);
    } catch(e) {}

    // 2. Zkus LZString.compressToEncodedURIComponent (starší verze)
    if (!json) {
      try { json = LZString.decompressFromEncodedURIComponent(hash); } catch(e) {}
    }

    // 3. Zkus plain base64 (nejstarší verze)
    if (!json) {
      try { json = decodeURIComponent(escape(atob(hash))); } catch(e) {}
    }

    if (!json) throw new Error('Dekomprimace selhala');
    const data = decodeData(json);
    if (!data || !data.rows) throw new Error('Chybí data rows');
    render(data);
    // Naplánuj notifikace pokud jsou povoleny
    const notifEnabled = localStorage.getItem('dk_notif_enabled') === '1';
    if (notifEnabled && Notification.permission === 'granted') {
      updateNotifButton(true);
      setTimeout(() => scheduleNotifications(attackRows), 500);
    }
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="error">⚠️ Nepodařilo se načíst plán útoků. Odkaz je poškozený nebo neplatný.<br><small style="opacity:.6">${e.message}</small></div>`;
    console.error(e);
  }
  }); // end syncPlayedRows.then
}

function createAlarm(evt, sendTimeMs, tgt, src) {
  evt.preventDefault();
  // Budík 2 minuty před odesláním
  const alarmTime = new Date(sendTimeMs - 2 * 60 * 1000);
  const sendTime  = new Date(sendTimeMs);

  const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const uid = `dk-alarm-${sendTimeMs}-${Math.random().toString(36).slice(2)}@dk.cs112`;

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//DK Plánovač//cs',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART:${fmt(alarmTime)}`,
    `DTEND:${fmt(sendTime)}`,
    `SUMMARY:⚔️ Odeslat útok ${src} → ${tgt}`,
    `DESCRIPTION:Čas odeslání: ${sendTime.toLocaleTimeString('cs')}\\nCíl: ${tgt}\\nZdroj: ${src}`,
    'BEGIN:VALARM',
    'TRIGGER:PT0S',
    'ACTION:AUDIO',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `utok_${tgt.replace('|','_')}_${alarmTime.getHours()}${String(alarmTime.getMinutes()).padStart(2,'0')}.ics`;
  a.click();
  URL.revokeObjectURL(url);
}

async function markRowPlayedFromEl(el) {
  const tr = el.closest('tr');
  if (!tr) return;
  const cd = tr.querySelector('.countdown');
  const sendTime = parseFloat(cd?.dataset?.send);
  const row = attackRows.find(r => Math.abs(r.sendTime - sendTime) < 1000);
  if (!row) return;
  await markRowPlayed(row);
  tr.classList.add('played-row');
  tr.classList.remove('past-row');
  el.textContent = 'Odešlo';
  el.title = 'Klikni pro označení jako Zmeškal';
  el.onclick = () => unmarkRowPlayed(el);
  if (document.getElementById('hide-played')?.checked) setTimeout(() => renderTable(), 300);
}

async function unmarkRowPlayed(el) {
  const tr = el.closest('tr');
  if (!tr) return;
  const sendTime = parseFloat(tr.querySelector('.countdown')?.dataset?.send);
  const row = attackRows.find(r => Math.abs(r.sendTime - sendTime) < 1000);
  if (!row) return;
  const key = rowKey(row);
  playedRows.delete(key);
  try { localStorage.setItem('dk_played_rows', JSON.stringify([...playedRows])); } catch(e) {}
  try {
    const { data: { session } } = await sbP.auth.getSession();
    if (session) await sbP.from('played_rows').delete().eq('user_id', session.user.id).eq('row_key', key);
  } catch(e) {}
  tr.classList.remove('played-row');
  el.textContent = 'Zmeškal';
  el.style.cursor = 'pointer';
  el.title = 'Klikni pro označení jako Odešlo';
  el.onclick = () => markRowPlayedFromEl(el);
  if (document.getElementById('hide-played')?.checked) setTimeout(() => renderTable(), 300);
}
