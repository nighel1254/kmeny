<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK – Plán útoků</title>
<link rel="icon" href="/kmeny/icon-192.png">
<link rel="apple-touch-icon" href="/kmeny/icon-192.png">
<link rel="manifest" href="/kmeny/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DK Plán">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
  :root {
    --bg:#0d0a05;--panel:#1a1208;--border:#3a2a10;--gold:#d4a84b;--gold2:#f0c96a;
    --text:#e8d5a3;--dim:#8a7a5a;--green:#4a9a4a;--urgent:#cc3333;--night:#1a0a2a;
    --gold-night:#8a6aaa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;font-size:13px;}
  input,select,textarea{background:#140e04;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:13px;outline:none;}
  input[type="datetime-local"]{color-scheme:dark;}
  input[type="datetime-local"]::-webkit-calendar-picker-indicator{filter:invert(0.8);cursor:pointer;opacity:0.8;}

  /* Header */
  .top-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .top-bar h1{font-size:15px;color:var(--gold2);display:flex;align-items:center;gap:6px;}
  .top-bar .meta{font-size:11px;color:var(--dim);}

  /* Summary */
  .summary-bar{background:#1a1208;border-bottom:1px solid var(--border);padding:7px 16px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;align-items:center;}

  /* Table */
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;margin:12px;overflow:hidden;}
  .panel-header{padding:8px 14px;background:#1e1508;border-bottom:1px solid var(--border);font-weight:bold;color:var(--gold);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{background:#1a1208;color:var(--gold);font-weight:600;padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
  th:hover{color:var(--gold2);}
  td{padding:6px 10px;border-bottom:1px solid #1e1608;vertical-align:middle;}
  tr:hover td{background:#1e1a0e}
  .past-row td{opacity:.3;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.15);}
  .past-row{background:#070503!important;border-left:3px solid #333!important;}
  .played-row td{opacity:.4;text-decoration:line-through;text-decoration-color:rgba(80,200,80,.3);}
  .played-row{background:#040a04!important;border-left:3px solid #4a9a4a!important;}
  .night-row td{background:var(--night)!important}
  .coords{font-family:monospace;color:var(--gold2);font-weight:bold}
  .chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap;gap:3px;}
  .chip-noble{background:#2a0020;color:#ff80c0;border:1px solid #802060}
  .chip-night{background:#1a0a2a;color:#9a6aaa;border:1px solid #4a2a6a;margin-left:4px}
  .send-time{font-family:monospace;white-space:nowrap;}
  .send-time.night{color:var(--gold-night)}
  .arrival-time{font-family:monospace;white-space:nowrap;color:var(--dim)}
  .countdown{font-family:monospace;font-weight:bold;font-size:13px;}
  .countdown.ok{color:var(--green)}
  .countdown.soon{color:#c08020}
  .countdown.urgent{color:var(--urgent)}
  .countdown.past{color:var(--dim)}
  .play-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;background:#1a1208;border:1px solid var(--border);border-radius:4px;cursor:pointer;color:var(--green);text-decoration:none;}
  .play-btn svg{width:14px;height:14px;fill:currentColor}
  .play-btn:hover{background:#2a2010;border-color:var(--gold)}
  .error{background:#2a0a0a;border:1px solid #8b2020;border-radius:8px;padding:20px;text-align:center;color:#ff8080;margin:40px auto;max-width:500px}
  .night-toggle{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--dim);}
  .table-filter input{background:#140e04;border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:4px;font-size:12px;width:200px;}
  .warning-box{background:#2a0a00;border:1px solid #8b3000;border-radius:6px;padding:8px 14px;margin:8px 12px;font-size:12px;color:#ff9955;}
  .warning-box.bold{font-size:13px;font-weight:bold;}
  /* ── MOBILE ──────────────────────────────────────────────── */
  @media (max-width: 480px) {
    .top-bar { padding: 8px 12px; gap: 6px; }
    .top-bar h1 { font-size: 13px; }
    .summary-bar { overflow-x: auto; flex-wrap: nowrap; gap: 10px; font-size: 11px; padding: 6px 10px; white-space: nowrap; }
    .panel { margin: 6px; }
    .panel-header { flex-wrap: wrap; gap: 6px; font-size: 12px; }
    .panel-header > div { flex-wrap: wrap; gap: 5px; }
    .table-filter input { width: 130px; font-size: 11px; }
    .night-toggle { font-size: 11px; }

    /* Tabulka scroll */
    #tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { font-size: 11px; }
    th, td { padding: 5px 6px; }

    .warning-box { margin: 6px; font-size: 11px; }
  }
</style>
</head>
<body style="visibility:hidden">

<!-- Audio unlock banner -->
<div id="audio-banner" style="background:#1a1200;border-bottom:2px solid var(--gold);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
  <span style="font-size:20px;">🔔</span>
  <span style="flex:1;font-size:13px;color:var(--gold2);">Klikni pro zapnutí zvukových upozornění – siréna zazní 2 minuty před odesláním, i když máš stránku na pozadí.</span>
  <button id="audio-unlock-btn" onclick="unlockAudio()" style="background:var(--gold);color:#1a0e00;border:none;border-radius:6px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;">🔔 Zapnout upozornění</button>
</div>

<div id="app">
  <div style="text-align:center;padding:40px;color:var(--dim);">Načítám plán...</div>
</div>

<script>
const API_BASE = 'https://cs112.divokekmeny.cz';
const API_IMG  = `${API_BASE}/graphic/unit`;
const NIGHT_START = 0, NIGHT_END = 6;

const UNIT_EMOJI = { ram:'🪨', noble:'👑', lk:'🐎', scout:'🔍', axe:'🪓', tk:'🛡️', spear:'⚔️', sword:'🗡️', catapult:'💣', paladin:'✨' };
function unitImg(key) {
  const file = key==='lk'?'light':key==='tk'?'heavy':key==='scout'?'spy':key==='paladin'?'knight':key==='noble'?'snob':key;
  return `<img src="${API_IMG}/unit_${file}.png" style="width:20px;height:20px;vertical-align:middle;margin-right:3px;" onerror="this.outerHTML='<span style=margin-right:4px>${UNIT_EMOJI[key]||'⚔️'}</span>'">`;
}
const UNIT_LABELS = {
  ram:     `${unitImg('ram')} Beranidlo`,
  noble:   `${unitImg('noble')} Šlechtic`,
  lk:      `${unitImg('lk')} LK`,
  scout:   `${unitImg('scout')} Špeh`,
  axe:     `${unitImg('axe')} Sekerník`,
  tk:      `${unitImg('tk')} TK`,
  spear:   `${unitImg('spear')} Kopiník`,
  sword:   `${unitImg('sword')} Šermíř`,
  catapult:`${unitImg('catapult')} Katapult`,
  paladin: `${unitImg('paladin')} Paladin`,
};

const SMALL_ICO  = 'https://help.divokekmeny.cz/images/b/b6/Small.png';
const LARGE_ICO  = 'https://help.divokekmeny.cz/images/7/71/Large.png';
const MEDIUM_ICO = 'https://help.divokekmeny.cz/images/9/96/Medium.png';
const twImg = (url, style='') => `<img src="${url}" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;${style}" onerror="this.style.display='none'">`;
const NOBLE_FLIP = `<img src="${API_IMG}/unit_snob.png" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;transform:rotate(180deg);" onerror="this.style.display='none'">`;
const NOBLE_NORM = `<img src="${API_IMG}/unit_snob.png" style="width:18px;height:18px;vertical-align:middle;margin-right:3px;" onerror="this.style.display='none'">`;

function typeChip(r) {
  if (r.isFake && r.isFakeNoble) return `<span class="chip" style="background:#1a0a1a;color:#ffffff;border:1px solid #4a1a5a">${NOBLE_FLIP} fejk vlak</span>`;
  if (r.isFake)                  return `<span class="chip" style="background:#1a0a00;color:#40cc40;border:1px solid #206020">${twImg(SMALL_ICO)} fejk</span>`;
  if (r.srcCategory==='fullka')  return `<span class="chip" style="background:#2a0000;color:#ff4040;border:1px solid #802020">${twImg(LARGE_ICO)} fullka</span>`;
  if (r.srcCategory==='triq_off')return `<span class="chip" style="background:#1a1a00;color:#f0c040;border:1px solid #606010">${twImg(SMALL_ICO,'filter:sepia(1) saturate(3) hue-rotate(10deg)')} 3/4 off</span>`;
  if (r.srcCategory==='half_off')return `<span class="chip" style="background:#1a0e00;color:#c07840;border:1px solid #604020">${twImg(MEDIUM_ICO)} 1/2 off</span>`;
  if (r.srcCategory==='noble')   return `<span class="chip chip-noble">${NOBLE_NORM} vlak</span>`;
  return '';
}

let attackRows = [], cdInterval = null;
let currentSort = 'send', sortAsc = true;

const pad = n => String(Math.floor(n)).padStart(2,'0');
function fmtDT(dt)  { return `${dt.getDate()}.${dt.getMonth()+1}. ${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`; }
function fmtDur(ms) { const s=ms/1000,h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=Math.floor(s%60); return h?`${h}h ${m}m ${sc}s`:m?`${m}m ${sc}s`:`${sc}s`; }
function fmtHMS(ms) { const s=Math.floor(ms/1000); return `${pad(s/3600)}:${pad((s%3600)/60)}:${pad(s%60)}`; }
function isNight(ts){ const h=new Date(ts).getHours(); return h>=NIGHT_START&&h<NIGHT_END; }

function sortIndicator(col) {
  if (currentSort!==col) return '<span style="opacity:.3">↕</span>';
  return sortAsc?'↑':'↓';
}

function setSort(col) {
  if (currentSort===col) sortAsc=!sortAsc; else { currentSort=col; sortAsc=true; }
  renderTable();
}

// ── ZVUK SIRÉNY ────────────────────────────────────────────
let audioUnlocked = localStorage.getItem('dk_audio_unlocked') === '1';
let _audioResumeInterval = null;

function getAudioCtx() {
  // Vždy vytvoř nový context – Safari pozastaví starý na pozadí
  return new (window.AudioContext || window.webkitAudioContext)();
}

function unlockAudio() {
  if (audioUnlocked) {
    // Toggle OFF
    audioUnlocked = false;
    localStorage.removeItem('dk_audio_unlocked');
    if (_audioResumeInterval) { clearInterval(_audioResumeInterval); _audioResumeInterval = null; }
    const btn = document.getElementById('audio-unlock-btn');
    const banner = document.getElementById('audio-banner');
    if (banner) { banner.style.background='#1a1200'; banner.style.borderBottomColor='var(--gold)'; }
    if (btn) { btn.textContent='🔔 Zapnout upozornění'; btn.style.background='var(--gold)'; btn.style.color='#1a0e00'; }
    return;
  }
  try {
    // Odemkni audio kliknutím
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    ctx.close();

    audioUnlocked = true;
    localStorage.setItem('dk_audio_unlocked', '1');

    const banner = document.getElementById('audio-banner');
    const btn = document.getElementById('audio-unlock-btn');
    if (banner) { banner.style.background='#0a1a0a'; banner.style.borderBottomColor='var(--green)'; }
    if (btn) { btn.textContent='🔕 Vypnout upozornění'; btn.style.background='#205020'; btn.style.color='#80d080'; }

    // Test zvuk
    setTimeout(() => playSiren(0.15), 200);

    // Na Safari mobile – pravidelně "keepalive" audio aby se nesuspendoval
    _audioResumeInterval = setInterval(() => {
      if (!audioUnlocked) return;
      try {
        const ctx2 = new (window.AudioContext || window.webkitAudioContext)();
        const buf2 = ctx2.createBuffer(1, 1, 22050);
        const src2 = ctx2.createBufferSource();
        src2.buffer = buf2;
        src2.connect(ctx2.destination);
        src2.start(0);
        setTimeout(() => ctx2.close(), 100);
      } catch(e) {}
    }, 25000); // každých 25s tichý ping

  } catch(e) { console.warn('Audio unlock failed:', e); }
}

// Obnov stav tlačítka po načtení stránky
document.addEventListener('DOMContentLoaded', () => {
  if (audioUnlocked) {
    const banner = document.getElementById('audio-banner');
    const btn = document.getElementById('audio-unlock-btn');
    if (banner) { banner.style.background='#0a1a0a'; banner.style.borderBottomColor='var(--green)'; }
    if (btn) { btn.textContent='🔕 Vypnout upozornění'; btn.style.background='#205020'; btn.style.color='#80d080'; }
  }
});

// Na Safari – keepalive audio při návratu na stránku
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && audioUnlocked) {
    // Tiché přehrání pro odemčení AudioContext po pozastavení
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const buf = ctx.createBuffer(1,1,22050);
      const src = ctx.createBufferSource();
      src.buffer = buf; src.connect(ctx.destination); src.start(0);
      setTimeout(() => ctx.close(), 200);
    } catch(e) {}
    checkSirenAlerts();
  }
});

function playSiren(volume = 0.4) {
  if (!audioUnlocked) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    // Veselá fanfára – vzestupná melodie
    const notes = [
      { freq: 523, t: 0,    dur: 0.12 },  // C5
      { freq: 659, t: 0.13, dur: 0.12 },  // E5
      { freq: 784, t: 0.26, dur: 0.12 },  // G5
      { freq: 1047,t: 0.39, dur: 0.25 },  // C6
      { freq: 784, t: 0.65, dur: 0.12 },  // G5
      { freq: 1047,t: 0.78, dur: 0.4  },  // C6 (dlouhé)
    ];
    notes.forEach(({ freq, t, dur }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + t);
      gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + t + 0.01);
      gain.gain.setValueAtTime(volume, ctx.currentTime + t + dur - 0.05);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + t + dur);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + dur + 0.05);
    });
    setTimeout(() => ctx.close(), 1500);
  } catch(e) { console.warn('Audio error:', e); }
}

// Sleduj odpočty a přehraj sirénu 2 minuty před odesláním
const siren2minAlerted = new Set();
function checkSirenAlerts() {
  if (!audioUnlocked) return;
  const now = Date.now();
  attackRows.forEach(r => {
    const key = rowKey(r);
    if (playedRows.has(key) || siren2minAlerted.has(key)) return;
    const diff = r.sendTime - now;
    if (diff > 0 && diff <= 120000) {
      siren2minAlerted.add(key);
      playSiren();
      const tEl = document.createElement('div');
      tEl.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a0a00;border:2px solid var(--gold);border-radius:8px;padding:12px 24px;font-size:14px;font-weight:700;color:var(--gold2);z-index:9999;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.8);';
      tEl.innerHTML = `⏰ 2 minuty do odeslání!<br><span style="font-size:12px;font-weight:normal;">${r.srcX}|${r.srcY} → ${r.tgtX}|${r.tgtY}</span>`;
      document.body.appendChild(tEl);
      setTimeout(() => tEl.remove(), 8000);
    }
  });
}

// Na Safari – zkontroluj alerty když se stránka vrátí do popředí
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && audioUnlocked) {
    checkSirenAlerts();
  }
});

// ── WEB PUSH NOTIFIKACE ────────────────────────────────────
const VAPID_PUBLIC = 'BHrpp7MbdTooRg22UB1ePAGUfmJR2oHhH_BTqhzDKxGnrsJLpprM9vJdz914Nqcy5NCBJsjtAUvJoN5NUo4OzOY';
let swRegistration = null;

async function initServiceWorker() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    swRegistration = await navigator.serviceWorker.register('/kmeny/sw.js');
    await navigator.serviceWorker.ready;
    return swRegistration;
  } catch(e) { console.warn('SW failed:', e); return null; }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return new Uint8Array([...rawData].map(c => c.charCodeAt(0)));
}

function toast(msg, type='info', ms=3000) {
  const t = document.createElement('div');
  const colors = {ok:'#205020', err:'#502020', info:'#1a1a40'};
  t.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${colors[type]||colors.info};color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;z-index:9999;box-shadow:0 2px 12px rgba(0,0,0,.5);`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

async function resetNotifications() {
  localStorage.removeItem('dk_notif_enabled');
  localStorage.removeItem('dk_device_id');
  try {
    const { data: { session } } = await sbP.auth.getSession();
    if (session) await sbP.from('push_subscriptions').delete().eq('user_id', session.user.id);
  } catch(e) {}
  updateNotifButton(false);
  toast('Notifikace resetovány – klikni znovu pro zapnutí.', 'info', 4000);
}

async function enableNotifications() {
  // Toggle OFF
  if (localStorage.getItem('dk_notif_enabled') === '1') {
    localStorage.removeItem('dk_notif_enabled');
    updateNotifButton(false);
    try {
      const { data: { session } } = await sbP.auth.getSession();
      const deviceId = localStorage.getItem('dk_device_id') || 'default';
      if (session) await sbP.from('push_subscriptions').delete().eq('user_id', session.user.id).eq('device_id', deviceId);
    } catch(e) {}
    toast('Notifikace vypnuty.', 'info');
    return;
  }

  if (!('Notification' in window)) { toast('Prohlížeč nepodporuje notifikace.', 'err'); return; }

  const reg = await initServiceWorker();
  if (!reg) { toast('Service Worker se nepodařilo spustit.', 'err'); return; }

  const permission = await Notification.requestPermission();
  if (permission !== 'granted') { toast('Notifikace nebyly povoleny.', 'err'); return; }

  try {
    // Vytvoř push subscription
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
      });
    }

    // Ulož subscription + naplánované časy do Supabase
    const { data: { session } } = await sbP.auth.getSession();
    if (!session) { toast('Nejsi přihlášen.', 'err'); return; }

    const alarms = attackRows
      .filter(r => !playedRows.has(rowKey(r)))
      .map(r => ({
        send_time: Math.round(r.sendTime),
        src: `${r.srcX}|${r.srcY}`,
        tgt: `${r.tgtX}|${r.tgtY}`,
        row_key: rowKey(r)
      }))
      .filter(a => a.send_time - Date.now() > 60000); // jen budoucí

    // Unikátní ID zařízení (uložené v localStorage)
    let deviceId = localStorage.getItem('dk_device_id');
    if (!deviceId) {
      deviceId = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('dk_device_id', deviceId);
    }

    console.log(`Saving ${alarms.length} alarms, attackRows: ${attackRows.length}`);

    const subJson = JSON.stringify(sub.toJSON());
    await sbP.from('push_subscriptions').upsert({
      user_id: session.user.id,
      device_id: deviceId,
      subscription: subJson,
      alarms: alarms,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id,device_id' });

    localStorage.setItem('dk_notif_enabled', '1');
    updateNotifButton(true);
    toast(`✓ Notifikace zapnuty! Naplánováno ${alarms.length} upozornění.`, 'ok', 5000);
  } catch(e) {
    console.error('Push subscription failed:', e);
    toast('Nepodařilo se aktivovat notifikace: ' + e.message, 'err', 6000);
  }
}

function updateNotifButton(enabled) {
  const btn = document.getElementById('notif-btn');
  if (!btn) return;
  if (enabled) {
    btn.textContent = '🔔 Notifikace zapnuty';
    btn.style.background = '#205020';
    btn.style.color = '#80d080';
    btn.style.borderColor = '#205020';
  } else {
    btn.textContent = '🔔 Povolit notifikace';
    btn.style.background = 'transparent';
    btn.style.color = 'var(--gold)';
    btn.style.borderColor = 'var(--gold)';
  }
}

async function scheduleNotifications(rows) {
  // Při každém načtení aktualizuj alarmy v DB
  if (localStorage.getItem('dk_notif_enabled') !== '1') return;
  if (Notification.permission !== 'granted') return;
  try {
    const reg = await initServiceWorker();
    if (!reg) return;

function startAlarm(evt, rowIdx, link) {
  evt.preventDefault();
  const row = attackRows[rowIdx];
  if (row) {
    const diff = row.sendTime - Date.now();
    if (diff < 300000) {
      markRowPlayed(row);
      setTimeout(() => renderTable(), 300);

}

function updateCountdowns() {
  const now = Date.now();
  document.querySelectorAll('.countdown[data-send]').forEach(el => {
    const diff = +el.dataset.send - now;
    if (diff < 0) {
      const tr = el.closest('tr');
      const isPlayed = tr && tr.classList.contains('played-row');
      if (isPlayed) {
        el.textContent = 'Odešlo';
        el.className = 'countdown past';
        el.title = 'Klikni pro označení jako Zmeškal';
        el.style.cursor = 'pointer';
        el.onclick = () => unmarkRowPlayed(el);
      } else {
        el.textContent = 'Zmeškal';
        el.className = 'countdown past';
        el.title = 'Klikni pro označení jako Odešlo';
        el.style.cursor = 'pointer';
        el.onclick = () => markRowPlayedFromEl(el);
      }
      return;
    }
    const s=Math.floor(diff/1000);
    el.textContent=`${pad(s/3600)}:${pad((s%3600)/60)}:${pad(s%60)}`;
    el.className='countdown '+(diff<60000?'urgent':diff<600000?'soon':'ok');
  });
}

function renderTable() {
  const search     = (document.getElementById('tbl-search')?.value||'').toLowerCase();
  const hideNight  = document.getElementById('hide-night')?.checked;
  const hidePlayed = document.getElementById('hide-played')?.checked;
  const now        = Date.now();

  let visible = attackRows.filter(r => {
    if (!search && hideNight && r.night && !r.isPast) return false;
    // Skryj odeslané (played) ale NIKDY neSkryj zmeškaných (past ale ne played)
    if (hidePlayed && playedRows.has(rowKey(r))) return false;
    return true;
  });
  if (search) visible = visible.filter(r =>
    `${r.srcX}|${r.srcY} ${r.srcName||''} ${r.srcPlayer||''} ${r.tgtX}|${r.tgtY} ${r.tgtName||''}`.toLowerCase().includes(search)
  );

  // Sort
  const dir = sortAsc ? 1 : -1;
  visible = [...visible].sort((a,b) => {
    switch(currentSort) {
      case 'player': return dir*(a.srcPlayer||'').localeCompare(b.srcPlayer||'');
      case 'src':    return dir*(`${a.srcX}|${a.srcY}`).localeCompare(`${b.srcX}|${b.srcY}`);
      case 'type':   return dir*(a.srcCategory||'').localeCompare(b.srcCategory||'');
      case 'tgt':    return dir*(`${a.tgtX}|${a.tgtY}`).localeCompare(`${b.tgtX}|${b.tgtY}`);
      case 'arrive': return dir*(a.arrivalTime-b.arrivalTime);
      case 'travel': return dir*(a.travel-b.travel);
      default:       return dir*(a.sendTime-b.sendTime);
    }
  });

  // Summary
  const sharp  = attackRows.filter(r=>!r.isFake&&!r.isNoble);
  const nobles = attackRows.filter(r=>r.isNoble);
  const fakes  = attackRows.filter(r=>r.isFake);
  document.getElementById('sum-sharp').textContent = sharp.length;
  document.getElementById('sum-full').textContent  = sharp.filter(r=>r.srcCategory==='fullka').length;
  document.getElementById('sum-triq').textContent  = sharp.filter(r=>r.srcCategory==='triq_off').length;
  document.getElementById('sum-half').textContent  = sharp.filter(r=>r.srcCategory==='half_off').length;
  document.getElementById('sum-noble').textContent = nobles.length;
  document.getElementById('sum-fake-noble').textContent = fakes.filter(r=>r.isFakeNoble).length;
  document.getElementById('sum-fake').textContent  = fakes.filter(r=>!r.isFakeNoble).length;
  document.getElementById('sum-total').textContent = attackRows.length;
  document.getElementById('sum-count').textContent = `${visible.length} aktivních / ${attackRows.length} celkem`;

  // Night warnings
  const nightRows = attackRows.filter(r=>r.night&&!r.isPast);
  const wrapEl = document.getElementById('warnings-wrap');
  if (nightRows.length) {
    const ns = nightRows.filter(r=>!r.isFake&&!r.isNoble).length;
    const nf = nightRows.filter(r=>r.isFake).length;
    const nn = nightRows.filter(r=>r.isNoble).length;
    let lines = [];
    if (ns) lines.push(`${ns} ostrých útoků musí být odesláno v noci`);
    if (nf) lines.push(`${nf} fejků musí být odesláno v noci`);
    if (nn) lines.push(`${nn} vlaků šlechticů musí být odesláno v noci`);
    wrapEl.innerHTML = `<div class="warning-box">🌙 <strong>Upozornění – noční odesílání:</strong><br>${lines.map(l=>`• ${l}`).join('<br>')}</div>`;
    wrapEl.style.display='block';
  } else { wrapEl.style.display='none'; }

  // Table
  let html = `<table><thead><tr>
    <th onclick="setSort('idx')">#</th>
    <th onclick="setSort('src')">Zdroj ${sortIndicator('src')}</th>
    <th onclick="setSort('type')">Typ ${sortIndicator('type')}</th>
    <th onclick="setSort('tgt')">Cíl ${sortIndicator('tgt')}</th>
    <th>Jednotka</th>
    <th onclick="setSort('send')">Čas odeslání ${sortIndicator('send')}</th>
    <th onclick="setSort('arrive')">Čas příchodu ${sortIndicator('arrive')}</th>
    <th onclick="setSort('travel')">Cesta ${sortIndicator('travel')}</th>
    <th>Odpočet</th><th>▶</th>
  </tr></thead><tbody>`;

  visible.forEach((r, i) => {
    const past     = r.sendTime < now;
    const played   = playedRows.has(rowKey(r));
    const rowClass = played ? 'played-row' : past ? 'past-row' : r.night ? 'night-row' : '';
    const sendCls  = r.night ? 'send-time night' : 'send-time';
    const gameLink = r.srcId
      ? (r.tgtId
          ? `${API_BASE}/game.php?village=${r.srcId}&screen=place&target=${r.tgtId}`
          : `${API_BASE}/game.php?village=${r.srcId}&screen=place&x=${r.tgtX}&y=${r.tgtY}`)
      : `${API_BASE}/game.php?screen=place&x=${r.tgtX}&y=${r.tgtY}`;
    const rowIdx = attackRows.indexOf(r);

    html += `<tr class="${rowClass}" data-rowidx="${i}">
      <td style="color:var(--dim);font-size:11px;">${i+1}</td>
      <td><span class="coords">${r.srcX}|${r.srcY}</span> <span style="color:var(--dim)">${r.srcName||''}</span></td>
      <td>${typeChip(r)}</td>
      <td><span class="coords">${r.tgtX}|${r.tgtY}</span>${r.tgtName&&r.tgtName!==`${r.tgtX}|${r.tgtY}`?` <span style="color:var(--dim)">${r.tgtName}</span>`:''} ${r.tgtOwner?`<span style="color:#8a6aaa;font-size:11px;">(${r.tgtOwner})</span>`:''}</td>
      <td><span class="chip">${UNIT_LABELS[r.unit]||r.unit}</span>${r.night?'<span class="chip chip-night">🌙</span>':''}</td>
      <td class="${sendCls}">${fmtDT(new Date(r.sendTime))}</td>
      <td class="arrival-time">${fmtDT(new Date(r.arrivalTime))}</td>
      <td style="color:var(--dim);font-size:11px;">${fmtDur(r.travel)}</td>
      <td><span class="countdown" data-send="${r.sendTime}"></span></td>
      <td><a class="play-btn" href="#" onclick="startAlarm(event,${rowIdx},'${gameLink.replace(/'/g,"\\'")}')"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></a></td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('tbl-wrap').innerHTML = html;
  updateCountdowns();
}

function decodeData(json) {
  const d = JSON.parse(json);
  // Nový kompaktní formát (pole řádků)
  if (d.r) {
    return {
      player: d.p, world: d.w, exported: d.e * 1000,
      rows: d.r.map(a => ({
        srcId: a[0]||null, srcName: a[1], srcX: a[2], srcY: a[3], srcCategory: a[4], srcPlayer: a[5]||'',
        tgtX: a[6], tgtY: a[7], tgtName: a[8]||`${a[6]}|${a[7]}`, tgtId: a[9]||null, tgtOwner: a[10],
        unit: a[11], sendTime: a[12]*1000, arrivalTime: a[13]*1000, travel: a[14]*1000,
        isFake:      !!(a[15]&1),
        isFakeNoble: !!(a[15]&2),
        isNoble:     !!(a[15]&4),
        night:       !!(a[15]&8),
        nobleCount: a[16]||null
      }))
    };
  }
  // Formát z dashboard (objekty, krátké klíče p/w/e + rows pole objektů)
  if (d.p || d.w) {
    return { player: d.p, world: d.w, exported: (d.e||0) * 1000, rows: d.rows || [] };
  }
  // Starý formát (dlouhé klíče)
  return { player: d.player, world: d.world, exported: d.exported, rows: d.rows };
}

function init() {
  syncPlayedRows().then(() => {
    // Polling každých 30s
    setInterval(async () => {
      const prev = playedRows.size;
      await syncPlayedRows();
      if (playedRows.size > prev) renderTable();
    }, 30000);
  const hash = location.hash.slice(1);
  if (!hash) {
    document.getElementById('app').innerHTML = '<div class="error">⚠️ Neplatný odkaz – chybí data plánu.</div>';
    return;
  }
  try {
    let json = null;

    // 1. Zkus nový base64url formát (LZString.compressToBase64 + url-safe)
    try {
      const b64 = hash.replace(/-/g,'+').replace(/_/g,'/');
      const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
      json = LZString.decompressFromBase64(padded);
    } catch(e) {}

    // 2. Zkus LZString.compressToEncodedURIComponent (starší verze)
    if (!json) {
      try { json = LZString.decompressFromEncodedURIComponent(hash); } catch(e) {}
    }

    // 3. Zkus plain base64 (nejstarší verze)
    if (!json) {
      try { json = decodeURIComponent(escape(atob(hash))); } catch(e) {}
    }

    if (!json) throw new Error('Dekomprimace selhala');
    const data = decodeData(json);
    if (!data || !data.rows) throw new Error('Chybí data rows');
    render(data);
    // Naplánuj notifikace pokud jsou povoleny
    const notifEnabled = localStorage.getItem('dk_notif_enabled') === '1';
    if (notifEnabled && Notification.permission === 'granted') {
      updateNotifButton(true);
      setTimeout(() => scheduleNotifications(attackRows), 500);
    }
  } catch(e) {
    document.getElementById('app').innerHTML = `<div class="error">⚠️ Nepodařilo se načíst plán útoků. Odkaz je poškozený nebo neplatný.<br><small style="opacity:.6">${e.message}</small></div>`;
    console.error(e);
  }
  }); // end syncPlayedRows.then
}

function createAlarm(evt, sendTimeMs, tgt, src) {
  evt.preventDefault();
  // Budík 2 minuty před odesláním
  const alarmTime = new Date(sendTimeMs - 2 * 60 * 1000);
  const sendTime  = new Date(sendTimeMs);

  const fmt = d => d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const uid = `dk-alarm-${sendTimeMs}-${Math.random().toString(36).slice(2)}@dk.cs112`;

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//DK Plánovač//cs',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART:${fmt(alarmTime)}`,
    `DTEND:${fmt(sendTime)}`,
    `SUMMARY:⚔️ Odeslat útok ${src} → ${tgt}`,
    `DESCRIPTION:Čas odeslání: ${sendTime.toLocaleTimeString('cs')}\\nCíl: ${tgt}\\nZdroj: ${src}`,
    'BEGIN:VALARM',
    'TRIGGER:PT0S',
    'ACTION:AUDIO',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `utok_${tgt.replace('|','_')}_${alarmTime.getHours()}${String(alarmTime.getMinutes()).padStart(2,'0')}.ics`;
  a.click();
  URL.revokeObjectURL(url);
}

async function markRowPlayedFromEl(el) {
  const tr = el.closest('tr');
  if (!tr) return;
  const rowidx = parseInt(tr.dataset.rowidx);
  const row = attackRows[rowidx];
  if (!row) return;
  await markRowPlayed(row);
  tr.classList.add('played-row');
  el.textContent = 'Odešlo';
  el.title = 'Klikni pro označení jako Zmeškal';
  el.onclick = () => unmarkRowPlayed(el);
  if (document.getElementById('hide-played')?.checked) renderTable();
}

async function unmarkRowPlayed(el) {
  const tr = el.closest('tr');
  if (!tr) return;
  const rowidx = parseInt(tr.dataset.rowidx);
  const row = attackRows[rowidx];
  if (!row) return;
  const key = rowKey(row);
  playedRows.delete(key);
  try { localStorage.setItem('dk_played_rows', JSON.stringify([...playedRows])); } catch(e) {}
  // Odstraň z DB
  try {
    const { data: { session } } = await sbP.auth.getSession();
    if (session) await sbP.from('played_rows').delete().eq('user_id', session.user.id).eq('row_key', key);
  } catch(e) {}
  tr.classList.remove('played-row');
  el.textContent = 'Zmeškal';
  el.style.cursor = '';
  el.onclick = null;
  el.title = '';
  // Pokud je hide-played zapnuto, skryj řádek
  if (document.getElementById('hide-played')?.checked) renderTable();
}
